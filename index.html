<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6ccff6">
<title>Volcano Friends</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- shared SVG definitions (kept rendered, not display:none, so gradients work) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs id="gdefs"></defs>
</svg>

<svg id="bg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

<svg id="bird" viewBox="0 0 70 44" aria-hidden="true">
  <path class="wing" d="M28,20 Q20,2 6,6 Q18,14 26,24Z" fill="#ff8fb1" stroke="#b83d6b" stroke-width="2.5" stroke-linejoin="round"/>
  <ellipse cx="34" cy="26" rx="20" ry="13" fill="#ff5d8f" stroke="#b83d6b" stroke-width="3"/>
  <circle cx="50" cy="20" r="10" fill="#ff5d8f" stroke="#b83d6b" stroke-width="3"/>
  <path d="M58,19 L67,22 L58,25Z" fill="#ffbe0b" stroke="#c98a00" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="52" cy="18" r="3" fill="#2b2140"/>
  <path class="wing" d="M36,22 Q34,4 20,4 Q28,14 30,26Z" fill="#ffb3cb" stroke="#b83d6b" stroke-width="2.5" stroke-linejoin="round"/>
</svg>

<svg id="dino" viewBox="0 0 170 160" aria-hidden="true">
  <path d="M36,112 Q4,112 8,78 Q22,100 50,96Z" fill="#b388ff" stroke="#5b3a9e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M46,76 l8,-16 l8,14 M62,70 l9,-16 l7,15 M78,68 l9,-15 l6,15" fill="#ffb347" stroke="#c96f1c" stroke-width="4" stroke-linejoin="round"/>
  <rect x="50" y="118" width="20" height="30" rx="9" fill="#b388ff" stroke="#5b3a9e" stroke-width="5"/>
  <rect x="88" y="118" width="20" height="30" rx="9" fill="#b388ff" stroke="#5b3a9e" stroke-width="5"/>
  <ellipse cx="78" cy="104" rx="44" ry="34" fill="#b388ff" stroke="#5b3a9e" stroke-width="5"/>
  <ellipse cx="88" cy="112" rx="25" ry="20" fill="#e8dbff"/>
  <ellipse cx="124" cy="60" rx="34" ry="28" fill="#b388ff" stroke="#5b3a9e" stroke-width="5"/>
  <path d="M108,100 q14,-4 18,-16" stroke="#5b3a9e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="52" r="10" fill="#fff" stroke="#5b3a9e" stroke-width="3"/>
  <circle cx="133" cy="53" r="5.5" fill="#2b2140"/><circle cx="135" cy="50" r="2" fill="#fff"/>
  <path d="M120,72 Q136,82 152,68" stroke="#5b3a9e" stroke-width="5" fill="none" stroke-linecap="round"/>
  <circle cx="112" cy="68" r="7" fill="#ff8fb1" opacity=".7"/>
</svg>

<!-- PUZZLE -->
<div id="puzzle" class="hidden">
  <div id="board"><div id="guideImg"></div><div id="cells"></div><div id="full"></div></div>
</div>

<!-- QUIZ -->
<div id="quiz" class="hidden">
  <div id="volArea">
    <div id="qVolWrap" class="vwrap"></div>
    <div id="meter"></div>
  </div>
  <div id="qArea">
    <div id="qTop">
      <button id="repeat" aria-label="Say it again">
        <svg viewBox="0 0 64 64"><path d="M8,24 H20 L34,11 V53 L20,40 H8Z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
        <path d="M42,23 Q49,32 42,41" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M48,15 Q60,32 48,49" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div id="problem" style="display:none"></div>
    </div>
    <div id="bubbles"></div>
  </div>
</div>
<div id="prog" class="hidden"></div>

<!-- CELEBRATION after puzzle -->

<!-- REWARD -->
<div id="reward" class="overlay">
  <div id="rStars"></div>
  <div id="rVol" class="vwrap dance"></div>
  <div id="rBtns">
    <button id="againBtn" class="bigbtn play" aria-label="Play again"><svg viewBox="0 0 64 64"><path d="M20,12 L52,32 L20,52Z" fill="#fff" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></svg></button>
    <button id="puzBtn" class="bigbtn puz" aria-label="Home"><svg viewBox="0 0 64 64"><path d="M8,32 L32,10 L56,32" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16,30 V54 H48 V30" fill="#fff"/><rect x="27" y="38" width="10" height="16" rx="2" fill="#ff8c42"/></svg></button>
  </div>
</div>

<!-- PUZZLE PICKER -->
<div id="picker" class="overlay"><div id="pickGrid"></div><div id="sizeRow"></div></div>

<!-- START -->
<div id="start" class="overlay show">
  <div id="title"></div>
  <div id="choices">
    <button id="goPuzzle" class="choice" aria-label="Puzzles"><span class="cbadge"><svg viewBox="0 0 64 64"><path d="M14,18 H26 C23,6 41,6 38,18 H50 V30 C62,27 62,45 50,42 V54 H38 C41,66 23,66 26,54 H14 V42 C2,45 2,27 14,30 Z" fill="#fff"/></svg></span></button>
    <button id="goQuiz" class="choice" aria-label="Volcano game"><div id="homeVol" class="vwrap"></div>
      <span class="hb" style="--c:#2ec4b6;left:6%;top:14%">1</span><span class="hb" style="--c:#9b5de5;right:7%;top:10%">A</span><span class="hb" style="--c:#ff5d8f;right:10%;bottom:12%;--d:.6s">3</span></button>
  </div>
</div>

<canvas id="fx"></canvas>

<button id="homeBtn" class="hudbtn hidden" aria-label="Home"><svg viewBox="0 0 64 64"><path d="M8,32 L32,10 L56,32" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16,30 V54 H48 V30" fill="#fff"/><rect x="27" y="38" width="10" height="16" rx="2" fill="#ff8c42"/></svg></button>
<button id="mute" class="hudbtn" aria-label="Music on or off">
  <svg viewBox="0 0 64 64"><path d="M24,46 V16 L50,9 V39" stroke="#fff" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <circle cx="17" cy="46" r="9" fill="#fff"/><circle cx="43" cy="40" r="9" fill="#fff"/>
  <path class="slash" d="M10,10 L54,54" stroke="#ff5d8f" stroke-width="7" stroke-linecap="round"/></svg>
</button>
<button id="gear" class="hudbtn" aria-label="Grown-up settings (press and hold)">
  <svg viewBox="0 0 64 64">
    <g transform="translate(32,32)" fill="#7b6a9a">
      <rect x="-5" y="-19" width="10" height="38" rx="3"/><rect x="-5" y="-19" width="10" height="38" rx="3" transform="rotate(45)"/>
      <rect x="-5" y="-19" width="10" height="38" rx="3" transform="rotate(90)"/><rect x="-5" y="-19" width="10" height="38" rx="3" transform="rotate(135)"/>
      <circle r="14"/><circle r="6" fill="#fff"/>
    </g>
    <circle class="ring" cx="32" cy="32" r="28" fill="none" stroke="#9b5de5" stroke-width="5" stroke-linecap="round" transform="rotate(-90 32 32)"/>
  </svg>
</button>

<!-- PARENT SETTINGS -->
<div id="settings">
  <div id="setBox" role="dialog" aria-label="Grown-up settings">
    <h2>Grown-up settings</h2>
    <p class="hint">Settings are kept until this browser tab is closed.</p>
    <div id="setRows"></div>
    <div class="sacts">
      <button id="sFull">Full screen</button>
      <button id="sPuzzle">Pick a puzzle</button>
      <button id="sSkip">Volcano game</button>
      <button id="sDone" class="done">Done</button>
    </div>
  </div>
</div>

<!-- Plain scripts (not modules) so the game also works by double-clicking index.html. Order matters. -->
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/pictures.js"></script>
<script src="js/audio.js"></script>
<script src="js/voice.js"></script>
<script src="js/fx.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/quiz.js"></script>
<script src="js/main.js"></script>
</body>
</html>
